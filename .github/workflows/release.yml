name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  validate:
    name: Validate
    # HACS, hassfest, Python and script tests: nothing is published unless they pass.
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  release:
    name: Publish release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # manifest.json holds the version; Python reads it at runtime. The script
      # has no build step, so it carries a copy that must match.
      - name: Check the tag and the script match manifest.json
        run: |
          manifest=$(python3 -c 'import json;print(json.load(open("custom_components/violetas/manifest.json"))["version"])')
          script=$(sed -n 's/^const VERSION = "\([^"]*\)";.*/\1/p' custom_components/violetas/frontend/violetas.js)
          if [ "v$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json ($manifest)"
            exit 1
          fi
          if [ "$script" != "$manifest" ]; then
            echo "::error::frontend/violetas.js VERSION ($script) does not match manifest.json ($manifest)"
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
